name: La habitacion

on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build for ${{ matrix.dickname }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "CGO_ENABLED=0"
            dickname: "linux-amd64"
          - tag: "GOAMD64=v4 CC=gcc"
            dickname: "linux-amd64v4-glibc"
          - tag: "GOAMD64=v3 CC=gcc"
            dickname: "linux-amd64v3-glibc"
          - tag: "GOAMD64=v2 CC=gcc"
            dickname: "linux-amd64v2-glibc"
          - tag: "GOAMD64=v1 CC=gcc"
            dickname: "linux-amd64v1-glibc"
          - tag: "CC=gcc"
            dickname: "linux-amd64-glibc"
          - tag: "CC=musl-gcc"
            dickname: "linux-amd64-musl"
          - tag: "CGO_ENABLED=0 GOARCH=arm64 GOARM64=v9.2"
            dickname: "linux-arm64v9.2"
          - tag: "CGO_ENABLED=0 GOARCH=arm64"
            dickname: "linux-arm64"
          - tag: "GOOS=darwin GOARCH=arm64"
            dickname: "darwin-arm64"
          - tag: "GOOS=windows GOARCH=amd64"
            dickname: "windows-amd64.exe"

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo "version=$(grep 'const Version' cmd/version.go | cut -d'"' -f2)" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: "stable"
          cache: false

      - name: Build!
        shell: bash
        run: |
          sudo apt-get install musl musl-dev musl-tools
          ${{ matrix.tag }} go build -o ./mio-${{ matrix.dickname }} .

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@master
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: mio-${{ matrix.dickname }}
          body: |
            # 📝 Release Notes
            - Bump binary version to 0.6.3.
            - The protocol version has been locked to 1.0.0.
            - The protocol specification has been rewritten to make it more standardized.
            - Fixes and improvements.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send to mirror
        if: github.ref == 'refs/heads/main'
        uses: moaeiou/moaeiou/actions/rsync@main
        with:
          local: mio-${{ matrix.dickname }}
          remote: orgmio/mio/
          key: ${{ secrets.SSH_KEY }}
